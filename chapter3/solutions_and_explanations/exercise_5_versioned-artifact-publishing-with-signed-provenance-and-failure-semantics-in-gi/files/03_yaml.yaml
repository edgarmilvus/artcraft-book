# .gitlab-ci.yml — full publish_catalog job
stages: [resolve, build, audit, sign, publish]

variables:
  DOCKER_IMAGE: "registry.example.com/storytold/designcraft-cli:3.4"
  PIPELINE_VERSION: "1.0.0"

resolve_inputs:
  stage: resolve
  image: alpine:3.20
  script:
    - apk add --no-cache git bash jq
    - |
      set -eu
      mkdir -p work/in work/out blockers staging
      git archive --format=tar "$LAYOUT_REF" | tar -x -C work/in
      # Persist resolved inputs for downstream stages via dotenv artifacts.
      {
        echo "RESOLVED_LAYOUT_DIR=$(cd work/in && pwd)"
        echo "COMMIT_SHA=$(git rev-parse "$LAYOUT_REF")"
      } > resolved.env
  artifacts:
    reports:
      dotenv: resolved.env
    paths: [work/, blockers/, staging/]

publish_catalog:
  stage: publish
  image: $DOCKER_IMAGE
  needs: [resolve_inputs]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION'
  before_script:
    - |
      set -eu
      # The base image has designcraft-cli, pdfcraft-cli; we only add the
      # two permitted packages.
      apt-get update && apt-get install -y --no-install-recommends gnupg jq curl
    - |
      set -eu
      # Import the signing key from a masked, protected variable.
      echo "$CATALOG_GPG_KEY" | base64 -d | gpg --batch --import
      gpg --list-secret-keys --with-colons | grep '^sec' | head -1
    - mkdir -p out blockers staging

  script:
    - |
      set -euo pipefail
      OUT="$(pwd)/out"
      BLK="$(pwd)/blockers"
      STG="$(pwd)/staging"

      # ------------------------------------------------------------------
      # (1) Open the layout in DesignCraft and collect provenance.
      # ------------------------------------------------------------------
      SIGFILE="$STG/dc-inputs.json"
      node /opt/publish/collect-inputs.js \
        --root "$(pwd)" \
        --layout "work/in/layout.designcraft" \
        --out "$SIGFILE"

      # (1a) Audit: modified links.
      jq -e '[.links[] | select(.status != "ok")] | length == 0' \
        "$SIGFILE" \
        || { jq '[.links[] | select(.status != "ok")]' "$SIGFILE" > "$BLK/modified-links.json"; }

      # (1b) Audit: missing fonts.
      jq -e '[.fonts[] | select(.missing == true or .styleMissing == true)] | length == 0' \
        "$SIGFILE" \
        || { jq '[.fonts[] | select(.missing or .styleMissing)]' "$SIGFILE" > "$BLK/missing-fonts.json"; }

      # (1c) Audit: colour-space mismatch (link sRGB but exported to FOGRA39 without intent).
      jq -e '[.colorMismatches[]] | length == 0' \
        "$SIGFILE" \
        || { jq '{mismatches: .colorMismatches}' "$SIGFILE" > "$BLK/color-space-mismatch.json"; }

      # ------------------------------------------------------------------
      # (2) Export both PDFs via the DesignCraft MCP driver.
      # ------------------------------------------------------------------
      node /opt/publish/export-pdfs.js \
        --root "$(pwd)" \
        --layout "work/in/layout.designcraft" \
        --print "out/catalog-print.pdf" \
        --web   "out/catalog-web.pdf"

      # ------------------------------------------------------------------
      # (3) Verify PDF/A conformance of the web PDF in PdfCraft.
      # ------------------------------------------------------------------
      node /opt/publish/pdfa-verify.js \
        --root "$(pwd)" \
        --pdf "out/catalog-web.pdf" --level 2b \
        --report "$STG/pdfa-verify.json"

      if jq -e '.issues[] | select(.fixable == false)' "$STG/pdfa-verify.json" >/dev/null; then
        cp "$STG/pdfa-verify.json" "$BLK/pdfa-verify.json"
      fi

      # ------------------------------------------------------------------
      # (4) Fail closed: abort if any blocker exists.
      # ------------------------------------------------------------------
      if [ "$(ls -A "$BLK")" ]; then
        echo "Audit failed; blockers written."
        exit 1
      fi

      # ------------------------------------------------------------------
      # (5) Sign both PDFs and verify locally.
      # ------------------------------------------------------------------
      for f in catalog-print.pdf catalog-web.pdf; do
        gpg --batch --yes --local-user "$CATALOG_GPG_KEY_ID" \
            --detach-sign --armor "$OUT/$f"
        gpg --verify "$OUT/$f.asc" "$OUT/$f"
      done

      # ------------------------------------------------------------------
      # (6) Build the release manifest.
      # ------------------------------------------------------------------
      node /opt/publish/build-manifest.js \
        --root "$(pwd)" \
        --release "$RELEASE_VERSION" \
        --channel "$CHANNEL" \
        --layoutRef "$LAYOUT_REF" \
        --print "$OUT/catalog-print.pdf" \
        --web "$OUT/catalog-web.pdf" \
        --inputs "$SIGFILE" \
        --out "$OUT/release-manifest.json"

      gpg --batch --yes --local-user "$CATALOG_GPG_KEY_ID" \
          --detach-sign --armor "$OUT/release-manifest.json"
      gpg --verify "$OUT/release-manifest.json.asc" "$OUT/release-manifest.json"

      # ------------------------------------------------------------------
      # (7) Channel semantics: reject existing stable versions.
      # ------------------------------------------------------------------
      if [ "$CHANNEL" = "stable" ]; then
        CODE=$(curl -s -o /dev/null -w "%{http_code}" \
          --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/catalog/$RELEASE_VERSION/catalog-print.pdf")
        if [ "$CODE" = "200" ]; then
          echo '{"reason":"version exists","version":"'"$RELEASE_VERSION"'"}' > "$BLK/version-exists.json"
          echo "Stable version $RELEASE_VERSION already published."
          exit 1
        fi
      fi

      # ------------------------------------------------------------------
      # (8) Upload to STAGING first — never to catalog/ directly.
      # ------------------------------------------------------------------
      upload() {
        local path="$1" file="$2"
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$file" \
             "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$path"
      }
      for f in catalog-print.pdf catalog-print.pdf.asc \
               catalog-web.pdf catalog-web.pdf.asc \
               release-manifest.json release-manifest.json.asc; do
        upload "catalog-staging/$RELEASE_VERSION/$f" "$OUT/$f"
      done

      # ------------------------------------------------------------------
      # (9) Every audit passed — atomically PROMOTE.
      #     GitLab's Generic Package Registry has no rename; "promotion"
      #     means re-uploading to catalog/ then deleting staging. The
      #     re-upload is idempotent because GitLab accepts identical blobs
      #     for the same path/version and returns 200 rather than 409.
      # ------------------------------------------------------------------
      for f in catalog-print.pdf catalog-print.pdf.asc \
               catalog-web.pdf catalog-web.pdf.asc \
               release-manifest.json release-manifest.json.asc; do
        upload "catalog/$RELEASE_VERSION/$f" "$OUT/$f"
        curl --fail --request DELETE \
             --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/catalog-staging/$RELEASE_VERSION/$f"
      done

      echo "Published $RELEASE_VERSION to catalog/."

  artifacts:
    when: always
    paths:
      - out/
      - blockers/
      - staging/
    expire_in: 90 days
