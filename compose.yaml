services:
  artcraft:
    build:
      context: .
      dockerfile: Dockerfile
    image: artcraft-book:latest
    working_dir: /work
    volumes:
      - .:/work
      - artcraft-node-modules:/work/node_modules
      - artcraft-engines:/work/tools/craft-cli/bin
      - artcraft-venv:/work/.venv
    environment:
      - PHOTOCRAFT_DISABLE_GPU=1
      - WGPU_BACKEND=cpu
      - RUST_BACKTRACE=1
      - MCP_TIMEOUT_MS=300000
      # The live model paths: passed through from the host shell, so
      # `source ~/.config/artcraft/env.sh` before `docker compose run`.
      - OPENAI_COMPATIBLE_BASE_URL
      - OPENAI_COMPATIBLE_MODEL
      - OPENAI_COMPATIBLE_VISION_MODEL
      - OPENAI_COMPATIBLE_API_KEY
      - EMBEDDING_BASE_URL
      - EMBEDDING_MODEL
      - EMBEDDING_API_KEY
      - SEED_PHOTO_IDS
      - PG_DSN
      - LIGHTCRAFT_LIBRARY

volumes:
  artcraft-node-modules:
  artcraft-engines:
  artcraft-venv:
