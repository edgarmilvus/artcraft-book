name: CI

# Every push and pull request type-checks the whole tree. This is the cheap
# half of the contract: it proves that all 406 listings still compile and that
# every project README still describes the files next to it. It needs no
# engine binaries, so it runs on a Linux runner in a few minutes.
#
# The end-to-end run against the real engines lives in e2e.yml, because on a
# private repository a macOS runner is billed at ten times the normal rate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Type-check every listing (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the Python environment
        run: tools/install_python_deps.sh

      - name: Link the shared dependency tree into every project
        run: node tools/link_node_modules.mjs --check

      - name: Type-check the twenty chapters
        run: node tools/typecheck_all.mjs

      - name: Type-check the master MCP server
        run: ./node_modules/.bin/tsc -p tsconfig.master.json

      - name: Check every project README against the files it names
        run: python3 tools/check_project_readmes.py
